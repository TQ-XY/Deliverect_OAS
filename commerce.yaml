                        - 3.73398891371018
                        - 51.0311233802278
                        country: BE
                        city: Ghent
                        stateOrProvince: VOV
                      openingHours:
                        timezone: Europe/Brussels
                        dayTimeRanges:
                        - dayOfWeek: 1
                          startTime: '00:00:00'
                          endTime: '23:59:00'
                        - dayOfWeek: 2
                          startTime: '00:00:00'
                          endTime: '23:59:00'
                        - dayOfWeek: 3
                          startTime: '00:00:00'
                          endTime: '23:59:00'
                        - dayOfWeek: 4
                          startTime: '00:00:00'
                          endTime: '23:59:00'
                        - dayOfWeek: 5
                          startTime: '00:00:00'
                          endTime: '23:59:00'
                        - dayOfWeek: 6
                          startTime: '00:00:00'
                          endTime: '23:59:00'
                        - dayOfWeek: 7
                          startTime: '00:00:00'
                          endTime: '23:59:00'
                      distance: 1235
