    post:
      tags:
      - Endpoints
      summary: Copy of Checkout Basket
      description: Creates a checkout session from a basket, leading to a payment
        intent based on the provided gateway.
      operationId: post_commerce{accountId}checkouts-1
      parameters:
      - name: accountId
        in: path
        schema:
          type: string
          default: 668e4aa170efd23c474b2ad1
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - basket
              - payments
              properties:
                basket:
                  type: object
                  required:
                  - id
                  properties:
                    id:
                      type: string
                note:
                  type: string
                payments:
                  type: array
                  items:
                    properties:
                      type:
                        type: string
                        default: dpay
                        enum:
                        - dpay
                        - third_party
                        - gift_card
                      externalId:
                        type: string
                        default: ''
                        description: id of the payment provider
                      isPrepaid:
                        type: boolean
                        default: 'true'
                        description: indicates whether the order has been paid. For
                          Dpay it should be true.
                      amount:
                        type: integer
                        default: ''
                        description: total amount paid with 2 decimal digits. 800
                          would correspond to 8 in local currency
                      metadata:
                        type: object
                        properties: {}
                    type: object
                    required:
                    - type
                    - externalId
                    - isPrepaid
                    - amount
                order:
                  type: object
                  properties:
                    channelOrderId:
                      type: string
                      description: The full unique ID from the ordering channel, cannot
                        be reused within 48hr after pickup (across all accounts)
                    channelOrderDisplayId:
                      type: string
                      description: A more human‑readable order reference to provide,
                        usually shorter than the channelOrderId
            examples: {}
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                offline:
                  value:
                    id: 694138133662b46bddf06e70
