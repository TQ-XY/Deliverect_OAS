---
openapi: 3.2.0
info:
  title: Commerce API
  description: " Simplify online ordering for your restaurant or grocery store with
    Deliverect. Our platform seamlessly integrates multiple online ordering systems,
    consolidating orders from all channels into one easy-to-manage dashboard."
  version: 1.0.0
servers:
- url: https://api.staging.deliverect.com
security:
- bearerAuth: []
tags:
- name: Authentication
  description: " "
- name: Endpoints
  description: "(Deliverect Endpoints)"
paths:
  "/oauth/token":
    post:
      tags:
      - Authentication
      summary: Machine 2 Machine Access Token
      requestBody:
        content:
          application/json:
            schema:
              type: string
              example:
              - client_id: "{{clientId}}"
                client_secret: "{{clientSecret}}"
                audience: https://api.satging.deliverect.com
                grant_type: token
      parameters: []
      responses:
        '200':
          description: OK
          headers:
            Accept:
              schema:
                type: string
                example:
                - application/json
            Content-Type:
              schema:
                type: string
                example:
                - application/json
          content:
            application/json:
              schema:
                type: object
              example:
                access_token: ey**-**-Q
                expires_at: 1620899002
                token_type: Bearer
                scope: genericPOS provisioning
        '401':
          description: Unauthorized
          headers:
            Date:
              schema:
                type: string
                example:
                - Wed, 20 Feb 2019 13:11:39 GMT
            Content-Type:
              schema:
                type: string
                example:
                - application/json
            Content-Length:
              schema:
                type: integer
                example:
                - '60'
            Connection:
              schema:
                type: string
                example:
                - keep-alive
            X-Auth0-RequestId:
              schema:
                type: string
                example:
                - 1bb8a6bbea0c249b00dd
            X-RateLimit-Limit:
              schema:
                type: integer
                example:
                - '30'
            X-RateLimit-Remaining:
              schema:
                type: integer
                example:
                - '29'
            X-RateLimit-Reset:
              schema:
                type: integer
                example:
                - '1550668300'
            WWW-Authenticate:
              schema:
                type: string
                example:
                - Basic realm={{Users}}
            Cache-Control:
              schema:
                type: string
                example:
                - private, no-store, no-cache, must-revalidate, post-check=0, pre-check=0
          content:
            application/json:
              schema:
                type: object
              example:
                error: access_denied
                error_description: Unauthorized
