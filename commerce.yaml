  "/commerce/{accountId}/stores":
    get:
      tags:
      - Endpoints
      summary: Get Stores
      description: Returns the list of stores. A store represents a unique ordering
        experience from a specific location.
      operationId: commerce-channel-api-stores-get-stores
      parameters:
      - name: accountId
        in: path
        schema:
          type: string
          default: ''
        required: true
      - name: page
        in: query
        description: Page to be returned
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        description: 'Number of stores to be returned per page - Max: 100'
        schema:
          type: integer
          format: int32
          default: 50
      - name: latitude
        in: query
        description: Reference latitude coordinate to calculate store distance
        schema:
          type: number
          format: float
          default: 30.4515
      - name: longitude
        in: query
        description: Reference longitude coordinate to calculate store distance
        schema:
          type: number
          format: float
          default: -91.1871
      - name: sort
        in: query
        schema:
          type: string
          default: distance
      - name: fulfillmentType
        in: query
        description: 'Fulfillment type(s) available on the channelLink. e.g: delivery,eatIn'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    total: 1
                    page: 1
                    size: 50
                    items:
                    - id: 65eee6a9984a1bc1b9637c59
                      channelLinkId: 65eee6a9984a1bc1b9637c59
                      name: Store Name
                      currency: EUR
                      address:
