name: Deploy All APIs

on:
  push:
    branches:
      - main
jobs:
  channel-api:
    name: Deploy API doc on Bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Deploy API documentation
        uses: bump-sh/github-action@v1
        with:
          doc: 883926e0-674c-42e8-b9f6-8b1466744762
          token: ${{secrets.BUMP_TOKEN}}
          file: Channel/channel.json

  commerce-api:
    name: Deploy API doc on Bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
