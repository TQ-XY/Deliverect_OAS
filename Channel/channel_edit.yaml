openapi: 3.0.3
info:
  title: Channel API
  description: " Simplify online ordering for your restaurant or grocery store with Deliverect. Our platform seamlessly integrates multiple online ordering systems, consolidating orders from all channels into one easy-to-manage dashboard."
  version: 1.0.0
servers:
  - url: "https://api.staging.deliverect.com"
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: " "
  - name: Endpoints
    description: (Deliverect Endpoints)
paths:
  /oauth/token:
    post:
      tags:
        - Authentication
      summary: Machine 2 Machine Access Token
      requestBody:
        content:
          application/json:
            schema:
              type: string
              example:
                - client_id: "{{clientId}}"
                  client_secret: "{{clientSecret}}"
                  audience: "https://api.satging.deliverect.com"
                  grant_type: token
      parameters: []
      responses:
        "200":
          description: OK
          headers:
            Accept:
              schema:
                type: string
                example:
                  - application/json
            Content-Type:
              schema:
                type: string
                example:
                  - application/json
          content:
            application/json:
              schema:
                type: object
              example:
                access_token: ey**-**-Q
                expires_at: 1620899002
                token_type: Bearer
                scope: genericPOS provisioning
        "401":
          description: Unauthorized
          headers:
            Date:
              schema:
                type: string
                example:
                  - "Wed, 20 Feb 2019 13:11:39 GMT"
            Content-Type:
              schema:
                type: string
                example:
                  - application/json
            Content-Length:
              schema:
                type: integer
                example:
                  - "60"
            Connection:
              schema:
                type: string
                example:
                  - keep-alive
            X-Auth0-RequestId:
              schema:
                type: string
                example:
                  - 1bb8a6bbea0c249b00dd
            X-RateLimit-Limit:
              schema:
                type: integer
                example:
                  - "30"
            X-RateLimit-Remaining:
              schema:
                type: integer
                example:
                  - "29"
            X-RateLimit-Reset:
              schema:
                type: integer
                example:
                  - "1550668300"
            WWW-Authenticate:
              schema:
                type: string
                example:
                  - "Basic realm={{Users}}"
            Cache-Control:
              schema:
                type: string
                example:
                  - >-
                    private, no-store, no-cache, must-revalidate, post-check=0,
                    pre-check=0
          content:
            application/json:
              schema:
                type: object
              example:
                error: access_denied
                error_description: Unauthorized
  /{channelName}/order/{channelLinkId}:
    post:
      tags:
        - Endpoints
      summary: Create Order
      description: >-
        Your generic channel integration can use this endpoint to place a new
        order for a linked location. Note that, when sending a new order,
        Deliverect will check whether the party sending the order has the
        correct **scope** to do so. If not, they are considered unauthorized.
        The scope for generic channels is communicated to integrating parties
        together with the API Keys, and is checked in the request target URL
        only.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
            example:
              - channelOrderId: "{{channelOrderId-001}}"
                channelOrderDisplayId: "{{channelOrderDisplayId-001}}"
                channelLinkId: "{{channelLinkId-001}}"
                by: ""
                orderType: 2
                table: Table 23
                channel: 10000
                pickupTime: "2020-03-09T17:17:38Z"
                estimatedPickupTime: "2020-03-09T17:17:38Z"
                deliveryTime: "2020-03-09T17:17:38Z"
                deliveryIsAsap: true
                courier: restaurant
                customer:
                  name: Customer name
                  companyName: Deliverect
                  phoneNumber: 0123456789
                  email: customer@deliverect.com
                  tin: taxIdentificationNumber
                deliveryAddress:
                  street: The Krook
                  streetNumber: "4"
                  postalCode: "9000"
                  city: Gent
                  extraAddressInfo: ""
                orderIsAlreadyPaid: true
                payment:
                  amount: 975
                  type: 3
                note: This is a test note
                items:
                  - plu: T5
                    name: Bier (Hertog Jan)
                    price: 325
                    quantity: 1
                    remark: ""
                    subItems:
                      - plu: SI2
                        name: Fluitje
                        price: 0
                        quantity: 1
                        remark: ""
                        subItems: []
                  - plu: SO1
                    name: Cali SALMON
                    price: 550
                    quantity: 1
                    remark: Don't add peper
                    subItems: []
                decimalDigits: 2
                numberOfCustomers: 1
                deliveryCost: 0
                serviceCharge: 0
                discountTotal: 0
                tip: 100
      parameters:
        - name: channelName
          in: path
          schema:
            type: string
          required: true
        - name: channelLinkId
          in: path
          schema:
            type: string
          required: true
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: string
  /{channelName}/order/{channelLinkId}/:
    post:
      tags:
        - Endpoints
      summary: Cancel Order
      description: >-
        Your channel integration can process a cancellation using the same
        endpoint used create a new order.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrder"
            example:
              - channelOrderId: "{{channelOrderId-001}}"
                status: 110
                timeStamp: "2020-03-09T17:17:38Z"
                reason: Customer cancelled the order
                by: customer
      security:
        - bearerAuth: []
      parameters:
        - name: channelName
          in: path
          schema:
            type: string
          required: true
        - name: channelLinkId
          in: path
          schema:
            type: string
          required: true
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOrder"
  /{channelName}/menuStatus/{_id}:
    post:
      tags:
        - Endpoints
      summary: Menu Update (Async)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuUpdateCallbackAsync"
      parameters:
        - name: channelName
          in: path
          schema:
            type: string
          required: true
        - name: _id
          in: path
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
  /{channelName}/updateStoreStatus/{channelLinkId}:
    post:
      tags:
        - Endpoints
      summary: Update Store Status (open/closed)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreStatus"
            example:
              - status: closed
                reason: Too many failed orders
      parameters:
        - name: channelName
          in: path
          schema:
            type: string
          required: true
        - name: channelLinkId
          in: path
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                message: Changed store status
  /{channelName}/courierUpdate/{channelLinkId}":
    post:
      tags:
        - Endpoints
      summary: Update Courier Status
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourierOrGuestStatus"
            example:
              - channelOrderId: 63171d******d34b5efe
                courierUpdate:
                  status: 85
                  arrivalTime: "2022-10-25T16:24:40.482000Z"
                  deliveryTime: "2022-10-25T16:24:40.482000Z"
                  courier:
                    firstName: Joe
                    lastName: Driver
                    phoneNumber: +44 20 3936 1162
                    coordinates:
                      coordinates:
                        - -0.0785
                        - 51.52081
      parameters:
        - name: channelName
          in: path
          schema:
            type: string
          required: true
        - name: channelLinkId
          in: path
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
  /fulfillment/validate:
    post:
      tags:
        - Endpoints
      summary: Dispatch Availability
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchAvailability"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchAvailability"
              example:
                - validationId: 63171d81a8f1fd71d34b5efe
                  available: true
                  expiresAt: "2022-09-06 10:24:25.445709"
                  deliveryTimeETA: "2022-08-08 11:00:00"
                  price: 0
  /tables/{locationId}":
    get:
      tags:
        - Endpoints
      summary: GET POS tables
      description: >-
        Retrieves all tables and floors registered in a POS at a specific
        location.
      parameters:
        - name: locationId
          in: path
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPOStables"
        "400":
          description: "failed to get tables: Error messag"
        "422":
          description: Get tables action is not supported for this locatio
  /allAllegens:
    get:
      tags:
        - Endpoints
      summary: Allergens and tags
      description: This allows a channel to get allergens and tags existing in Deliverect.
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllergensAndTags"
              example:
                - name: Alcohol
                  allergenId: 1
                - name: Halal
                  allergenId: 2
                - name: Kosher
                  allergenId: 3
                - name: Vegan
                  allergenId: 4
                - name: Vegetarian
                  allergenId: 5
  /updateStoreStatus:
    post:
      tags:
        - Endpoints
      summary: Update Store Status (open/closed)
      description: >-
        This allows a channel to inform Deliverect of any change to a store's
        status.
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStoreStatus"
              example:
                - message: Changed store status
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreStatus"
    parameters:
      - name: channelName
        in: path
        required: true
        schema:
          type: string
        example: "{{channelName}}"
      - name: channelLinkId
        in: path
        required: true
        schema:
          type: string
        example:
          - status: open
            reason: Channel is opened
  /{channelName}/updateRating:
    post:
      tags:
        - Endpoints
      summary: Order Rating Update
      description: >-
        Your generic channel integration can use this endpoint to update rating
        for previously placed order. Note that, when sending rating update,
        Deliverect will check whether the party sending the order has the
        correct scope to do so. If not, they are considered unauthorized. The
        scope for generic channels is communicated to integrating parties, and
        is checked in the request target URL only. Therefore, make sure this URL
        correctly contains the scope. As a payload we always expect a JSON that
        contains: * Channel order id (`channelOrderId`) * Date(UTC) when order
        was placed in ISO 8601 format (`orderDate`) * Id of the channel link
        (`channelLinkId`) * Array of rating objects (`rating`) * Subject of the
        rating. See allowed values in Rating Subjects table (`subject`) * Rating
        value from 0 to 10 (`rating`) * [Optional] Comment for the rating
        (`comment`) * [Optional] Reason for negative rating. See allowed values
        in Rating Reasons table (`reason`) #### Rating Subjects | Subject |
        Integer value | | - | - | | Restaurant | 1 | | Delivery | 2 | ####
        Rating reasons | Reason | Integer value | | - | - | | Item missing | 1 |
        | Order issue | 2 | | Order is wrong | 3 | | Food isn't fresh | 4 | |
        Food is cold | 5 | | Box was opened | 6 | | Delivery late | 7 | |
        Delivery issue | 8 | | Rude staff | 9 | | No issues | 10000 |
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRatingUpdate"
            example:
              - channelOrderId: CXTDBKMZ-1229
                orderDate: "2021-04-13T11:53:34.453000Z"
                channelLinkId: 606d8489fcd8eddf13b121a6
                rating:
                  - reason: 10000
                    rating: 5
                    comment: Food was amazing.
                    subject: 1
                  - rating: 5
                    subject: 2
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: "{authToken}"
        - name: channelName
          in: path
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Machine2MachineAccessTokenRequest:
      title: Get Access Token
      required:
        - client_id
        - client_secret
        - audience
        - grant_type
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        audience:
          type: string
        grant_type:
          type: string
      example:
        - client_id: "{{clientId}}"
          client_secret: "{{clientSecret}}"
          audience: "https://api.deliverect.com"
          grant_type: client_credentials
    CreateOrder:
      title: Create Order
      required:
        - channelOrderId
        - channelOrderDisplayId
        - orderType
        - courier
        - payment
        - payment.amount
        - payment.type
        - taxes.total
        - items
        - items.plu
        - items.name
        - items.price
        - items.quantity
        - deliveryIsAsap
        - decimalDigits
      type: object
      properties:
        channelOrderId:
          type: string
        channelOrderDisplayId:
          type: string
        courier:
          type: integer
        payment:
          type: object
        payment.amount:
          type: integer
        payment.type:
          type: integer
        taxes.totaL:
          type: integer
        items:
          type: array
        items.plu:
          type: string
        items.name:
          type: string
        items.price:
          type: string
        items.quantity:
          type: string
        decimalDigits:
          type: integer
        deliveryIsAsap:
          type: boolean
      example:
        - items:
            - plu: P-SATE
              name: Chicken Sate
              price: 450
              quantity: 1
              remark: well done
              subItems:
                - plu: RICE-01
                  name: White Rice
                  price: 450
                  deliveryTax: 9000
                  quantity: 1
                  subItems:
                    - plu: SAUCE-01
                      name: Sate Sauce
                      price: 50
                      deliveryTax: 9000
                      quantity: 1
          decimalDigits: 2
          by: Deliverect
          courier: restaurant
          channel: 1
          payment:
            amount: 1750
            type: 0
            rebate: 0
            commissionType: regular
          orderType: 2
          deliveryAddress:
            street: Adelaide Street East
            streetNumber: "207"
            postalCode: M5A1N4
            area: Distillery District
            city: Toronto
            extraAddressInfo: 1st floor
            coordinates:
              latitude: 43.65152
              longitude: -79.37128
          deliveryCost: 300
          serviceCharge: 400
          discountTotal: -100
          note: extra spicy
          customer:
            name: "John "
            companyName: Deliverect
            phoneNumber: 0618776767
            phoneAccessCode: "1123"
            email: test@test.com
            tin: tax identification number
            note: call once you arrive
          orderIsAlreadyPaid: true
          deliveryIsAsap: true
          deliveryTime: "2023-05-12T11:39:22.876Z"
          bagFee: 0
          tip: 200
          discounts:
            - type: order_flat_off
              provider: channel
              name: Test discount
              channelDiscountCode: test 1234
              referenceId: testId
              value: 100
              amount: 100
          pickupTime: "2023-05-12T11:39:22.876Z"
          channelOrderId: TEST16838915628
          channelOrderDisplayId: T8915628
    CancelOrder:
      title: Cancel Order
      required:
        - channelOrderId
        - channelOrderDisplayId
        - channelLinkId
        - status
        - cancellationReason
      type: object
      properties:
        channelOrderId:
          type: string
        channelOrderDisplayId:
          type: string
        channelLinkId:
          type: string
        status:
          type: integer
        cancellationReason:
          type: string
      example:
        - channelOrderId: CXTDBKMZ-1229
          channelOrderDisplayId: "1229"
          channelLinkId: 5e****abc11dec0001****9b
          status: 100
          cancellationReason: Customer requests order cancellation
    MenuUpdateCallbackAsync:
      title: Menu Update Callback (Async)
      required:
        - channelName
        - _id
      type: object
      properties:
        channelName:
          type: string
        _id:
          type: string
      example:
        - status: ONLINE
          comment: string
    UpdateStoreStatus:
      title: Update Store Status (open/closed)
      required:
        - status
        - reason
      type: object
      properties:
        status:
          type: string
        reason:
          type: string
      example:
        - status: closed
          reason: Too many failed orders
    UpdateCourierOrGuestStatus:
      title: Update Courier/Guest Status
      required:
        - channelOrderId
        - courierUpdate.status
      type: object
      properties:
        channelOrderId:
          type: string
        courierUpdate.status:
          type: string
      example:
        - channelOrderId: 63171d******d34b5efe
          courierUpdate:
            status: 85
            arrivalTime: "2022-10-25T16:24:40.482000Z"
            deliveryTime: "2022-10-25T16:54:40.482000Z"
            courier:
              firstName: Joe
              lastName: Driver
              phoneNumber: +44 20 3936 1162
              pickupNotes: "Red Jeep, Parking spot 1a"
    DispatchAvailability:
      title: Dispatch Availability
      required:
        - channelLinkId
        - deliveryLocations
        - deliveryTime
        - coordinates
        - street
        - streetNumber
        - city
        - country
        - postalCode
      type: object
      properties:
        channelLinkId:
          type: string
        deliveryLocations:
          type: object
        deliveryLocations.deliveryTime:
          type: string
        coordinates:
          type: array
        street:
          type: string
        streetNumber:
          type: string
        city:
          type: string
        postalCode:
          type: string
      example:
        - deliveryLocations:
            packageSize: unknown
            name: None
            phone: None
            coordinates:
              coordinates:
                - -113
                - -113
            street: customer street and number
            city: customer city
            country: customer country
            postalCode: postal code
            deliveryTime: "2024-10-17T10:00:00Z"
          channelLinkId: 61bcc34f657cc48c23eb60d5
    GetPOStables:
      title: Get POS tables
      required:
        - locationId
      type: object
      properties:
        locationId:
          type: string
      example:
        - tables:
            - id: "barSeat#1"
              name: "Bar seat #1"
              floorId: bar
              seats: 1
            - id: "barSeat#2"
              name: "Bar seat #2"
              floorId: bar
              seats: 1
            - id: "barSeat#3"
              name: "Bar seat #3"
              floorId: bar
              seats: 1
            - id: "table#1"
              name: "Table #1"
              floorId: restaurant
              seats: 6
            - id: "table#2"
              name: "Table #2"
              floorId: restaurant
              seats: 8
            - id: Delivery
              name: delivery
          floors:
            - id: bar
              name: Bar
            - id: restaurant
              name: Restaurant
    GetAllergensAndTags:
      title: Get POS Allergens and Tags
      type: object
      properties:
        name:
          type: string
        allergenId:
          type: integer
      example:
        - - name: Alcohol
