          - name: Gluten Free
            allergenId: 1101
          - name: Sugar Free
            allergenId: 1128
          - name: Lac Free
            allergenId: 1129
          - name: Paracetamol
            allergenId: 2000
          - name: Aspirin
            allergenId: 2001
          - name: Ibuprofen
            allergenId: 2002
          - name: Infant Formula
            allergenId: 2003
    OrderRatingUpdate:
      title: Order Rating Update
      required:
        - channelOrderId
        - orderDate
        - channelLinkId
        - rating
      type: object
      properties:
        channelOrderId:
          type: string
        orderDate:
          type: string
        channelLinkId:
          type: string
        rating:
          type: array
      example:
        - rating:
            - reason: 10000
              rating: "5"
              comment: Food was amazing.
              subject: 1
    ChannelRegistration:
      title: Channel Registration
      required:
        - statusUpdateURL
        - menuUpdateURL
        - snoozeUnsnoozeURL
        - busyModeURL
      type: object
      properties:
        statusUpdateURL:
          type: string
        menuUpdateURL:
          type: string
        snoozeUnsnoozeURL:
          type: string
        busyModeURL:
          type: string
      example:
        - ChannelRegistration:
            - statusUpdateURL: "{{https://integrator.com/orderstatusUpdate}}"
              menuUpdateURL: "{{https://integrator.com/menuUpdate}}"
              snoozeUnsnoozeURL: "{{https://integrator.com/snoozeUnsnooze}}"
              busyModeURL: "{{https://integrator.com/busyMode}}"
              updatePrepTimeURL: "{{https://integrator.com/updatePrepTimeURL}}"
              courierUpdateURL: "{{https://integrator.com/courierUpdateURL}}"
    Menu:
     type: array
     required:
      - menu
      - menuId
      - menuType
      - channelLinkId
      - nestedModifiers
     properties:
        menu:
         type: string
         description: Name of the menu

        menuTranslations:
           type: object
           additionalProperties:
            type: string

        description:
          type: string

        descriptionTranslations:
          type: object
        additionalProperties:
          type: string
        menuImageURL:
           type: string
           format: uri

        menuId:
          type: string
          description: Internal Deliverect menu id

        menuType:
          type: integer
          enum: [0, 1, 2, 3, 4]
          description: |
            DELIVERY_AND_PICKUP = 0
            DELIVERY = 1
            PICKUP = 2
            EAT_IN = 3
            CURBSIDE = 4

        channelLinkId:
          type: string

        nestedModifiers:
          type: boolean

        currency:
         type: string

        productTags:
          type: array
          items:
           type: integer

        availabilities:
          type: array
          items:
            $ref: "#/components/schemas/Availability"

        categories:
           type: array
           items:
             $ref: "#/components/schemas/Category"

        products:
         type: object
         items:
          $ref: "#/components/schemas/Item"

        modifiers:
         type: object
         items:
           $ref: "#/components/schemas/Item"

        modifierGroups:
         type: object
         items:
         $ref: "#/components/schemas/Item"

        snoozedProducts:
         type: object
         additionalProperties:
          $ref: "#/components/schemas/SnoozeUnsnoozeProducts"
    Availability:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
       dayOfWeek:
        type: integer
        minimum: 1
        maximum: 7
       startTime:
        type: string
        example: "09:00"

       endTime:
        type: string
        example: "22:00"
    Category:
      type: object
      required: [_id, name]
      properties:
        _id:
         type: string

        name:
         type: string

        nameTranslations:
         type: object
        additionalProperties:
         type: string

        description:
         type: string

        descriptionTranslations:
         type: object
         additionalProperties:
          type: string

        imageUrl:
         type: string
         format: uri

        availabilities:
         type: array
         items:
          $ref: "#/components/schemas/Availability"

        subProducts:
          type: array
        items:
         type: string

        menu:
         type: string

        account:
         type: string
    Item:
      type: object
      required:
       - _id
       - plu
       - name
       - price
       - productType
       - deliveryTax
       - takeawayTax
       - eatInTax
       - max
       - min
       - multiply
       - snoozed
      properties:
       _id:
        type: string

       plu:
        type: string

       gtin:
        type: array
        items:
         type: string

       imageUrl:
        type: string
        format: uri

       name:
        type: string

       nameTranslations:
        type: object
       additionalProperties:
        type: string
       description:
        type: string
       descriptionTranslations:
         type: object
         additionalProperties:
          type: string

       price:
        type: integer
        description: Stored with 2 decimal digits

       productType:
        type: integer
        enum: [1, 2, 3]
        description: PRODUCT=1, MODIFIER=2, MODIFIER_GROUP=3

       deliveryTax:
        type: integer

       takeawayTax:
        type: integer

       eatInTax:
        type: integer

       max:
        type: integer

       min:
        type: integer

       multiMax:
        type: integer

       defaultQuantity:
        type: integer

       multiply:
        type: integer

       isCombo:
        type: boolean

       isVariant:
        type: boolean

       isVariantGroup:
        type: boolean

       snoozed:
        type: boolean

       productTags:
        type: array
       items:
        type: integer
       subProducts:
        type: array
       beverageInfo:
        $ref: "#/components/schemas/BeverageInfo"

       calories:
        type: integer

       caloriesRangeHigh:
        type: integer

       nutritionalInfo:
        $ref: "#/components/schemas/NutritionalInfo"

       packaging:
        type: object
        properties:
          count:
           type: integer
          reusable:
           type: boolean
          storageInstructions:
           type: string

       supplementalInfo:
         type: object
         properties:
          legalName:
           type: string
          instructionForUse:
           type: boolean
          ingredients:
           type: array
    BeverageInfo:
      type: object
      properties:
        caffeine:
          type: integer
        alcohol:
          type: integer
    NutritionalInfo:
          type: object
          properties:
            fat:
             type: integer
            sugar:
             type: integer
            protein:
             type: integer
            salt:
             type: integer
            servingSize:
             $ref: "#/components/schemas/ServingSize"
            netQuantity:
             $ref: "#/components/schemas/NetQuantity"
    ServingSize:
            type: object
            properties:
              amount:
               type: integer
              unitType:
               type: integer
               enum: [1, 2, 3]
              countUnitDescription:
               type: string
    NetQuantity:
            type: object
            properties:
             amount:
              type: integer
             unitType:
              type: integer
              enum: [1, 2, 3]
             countUnitDescription:
              type: string
    OrderUpdateStatus:
      title: Order Update Status
      required:
        - orderId
        - status
        - timeStamp
        - location
        - channelLink
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
        timeStamp:
          type: string
        receiptId:
          type: string
        reason:
          type: string
        channelOrderId:
          type: string
        location:
          type: string
        channelLink:
          type: string
      example:
        - OrderUpdateStatus:
            - orderId: 61********************b4
              status: 20
              timeStamp: "YYYY-MM-DDTHH:mm:ss.SSSSSSZ"
              receiptId: ""
              reason: ""
              channelOrderId: TEST******4206
              location: 61********************b4
              channelLink: 61********************c3
    CourierUpdate:
      title: Courier Update
      type: object
      properties:
        orderId:
          type: string
          description: The unique ID of the order in Deliverect
        channelOrderId:
          type: string
          description: The unique ID of the order sourced from the ordering channel
        status:
          type: integer
          description: The status from the supported list of values for courier updates.
        pickupTime:
          type: string
          format: date-time
          description: >-
            The arrival time for the courier to their pickup location in UTC
            (yyyy-MM-ddTHH:mm:ssZ). Only available prior to status 85.
        deliveryTime:
          type: string
          format: date-time
          description: "The delivery time shown in UTC (yyyy-MM-ddTHH:mm:ssZ)"
        courierName:
          type: string
          description: Name of the courier / rider
        coordinates:
          type: object
          description: The coordinates object showing longitude and latitude
          properties:
            coordinates:
              type: array
              items:
                type: number
                format: double
              minItems: 2
              maxItems: 2
              example:
                - -0.1278
                - 51.5074
        courierId:
          type: string
          description: Unique Id of the courier when using the Deliverect Courier App
        dispatchPartner:
          type: string
          description: The name of the dispatch partner company
        multipleDrivers:
          type: boolean
          description: Sent as true when the delivery is split across more than one driver
    SnoozeUnsnoozeProducts:
      title: Snooze/Unsnooze Products
      type: object
      required:
        - accountId
        - locationId
        - channelLinkId
        - operations
      properties:
        accountId:
          type: string
          description: The ID of the customer account
        locationId:
          type: string
          description: The ID of a specific location in the customer account
        channelLinkId:
          type: string
          description: The unique id of the store on the channel platform
        operations:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                  - snooze
                  - unsnooze
                description: The action to perform on the items
              data:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SnoozeItem"
    SnoozeItem:
      type: object
      required:
        - plu
      properties:
        plu:
          type: string
          description: The unique identifier (Price Look-Up) of the item
        snoozeStart:
          type: string
          format: date-time
          description: When snooze status should begin in UTC
        snoozeEnd:
          type: string
          format: date-time
          description: When snooze status should end in UTC
    BusyModeUpdate:
      title: Busy Mode Update
      type: object
      required:
        - accountId
        - locationId
        - channelLinkId
        - status
      properties:
        accountId:
          type: string
          description: The ID of the customer account
        locationId:
          type: string
          description: The ID of a specific location in the customer account
        channelLinkId:
          type: string
          description: The unique id of the store on the channel platform
        status:
          type: string
          description: "True if the store is in busy mode, false otherwise"
      example:
        - BusyModeUpdate:
            - accountId: 5b****71c6489f0029****d4
              locationId: 5c****ecc6489f0001****b8
              channelLinkId: 5e****abc11dec0001****9b
              status: PAUSED
    PreparationTimeUpdate:
      title: Preparation Time Update
      type: object
      required:
        - channelOrderId
        - orderId
        - location
        - status
        - pickupTime
      properties:
        channelOrderId:
          type: string
          description: The unique ID of the order sourced from the ordering channel
        orderId:
          type: string
          description: The unique ID of the order in Deliverect
        location:
          type: string
          description: The unique ID of the location in Deliverect
        status:
          type: integer
          description: >-
            The status from the supported list of values for order status
            updates.
        pickupTime:
          type: string
          format: date-time
          description: "The updated pickup time in UTC (yyyy-MM-ddTHH:mm:ssZ)"
      example:
        - channelOrderId: 63171d******d34b5efe
          orderId: 63171d******d34b5efe
          location: 61********************b4
          status: 20
          pickupTime: "2021-04-20T16:20:00Z"
    PaymentUpdate:
      title: Payment Update
      type: object
      required:
        - paymentId
        - status
      properties:
        paymentId:
          type: string
          description: The unique ID of the payment in Deliverect Pay
        status:
          type: string
          description: >-
            The status of the payment update. Allowed values: 'COMPLETED',
            'FAILED', 'REFUNDED'
      example:
        - paymentId: 651142e93c54c5405****6a3
          status: authorized
